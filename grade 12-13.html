<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 12 & 13 Student Information</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        h1, h3, h4 {
            text-align: center;
            color: #2c3e50;
            margin: 10px 0;
        }

        table {
            border-collapse: collapse;
            width: 90%;
            margin: 20px auto;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 15px;
            text-align: center;
            border: 1px solid #ddd;
        }

        th {
            background-color: #6c5ce7;
            color: white;
            font-weight: 600;
        }

        .stream-header {
            background-color: #58D68D !important;
            color: white;
            text-align: center;
            padding: 10px;
        }

        .stream-header h3 {
            margin: 0;
            color: white;
        }

        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #6c5ce7;
            outline: none;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: white;
            transition: transform 0.2s, box-shadow 0.2s;
            min-width: 150px;
        }

        button[type="submit"] {
            background-color: #58D68D;
        }

        button[type="reset"] {
            background-color: #ff9f43;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* Custom Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .modal-content {
            position: relative;
            background-color: white;
            margin: 15% auto;
            padding: 30px;
            width: 400px;
            border-radius: 10px;
            text-align: center;
            animation: modalSlide 0.3s ease-out;
        }

        @keyframes modalSlide {
            from {transform: translateY(-100px); opacity: 0;}
            to {transform: translateY(0); opacity: 1;}
        }

        .modal-button {
            background-color: #6c5ce7;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }

        .subject-name {
            font-weight: bold;
            text-align: left;
        }

        caption {
            margin-top: 20px;
            font-style: italic;
            color: #666;
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #6c5ce7;
            border-radius: 50%;
            position: fixed;
            top: 50%;
            left: 50%;
            margin-top: -20px;
            margin-left: -20px;
            animation: spin 1s linear infinite;
            z-index: 1001;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Grade 12 & 13 Student Information</h1>
        <h3>Zonal Education Office - Thanamalwila</h3>

        <form id="studentForm" method="POST" action="https://docs.google.com/forms/u/0/d/e/1FAIpQLSf8qLi_mBt4BkFGDP0a5tUmIJAdrr0odZaahA6OcmMhssxteA/formResponse">
            <!-- Your existing form content here with all the input fields -->
            <!-- Keep all the same input fields and their entry.* names -->
            
            <div class="button-container">
                <button type="submit">SUBMIT</button>
                <button type="reset">RESET</button>
            </div>
            
            <caption>ZEO - Thanamalwila</caption>
        </form>
    </div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="spinner"></div>

    <!-- Success Modal -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <h2>Success!</h2>
            <p>Your form has been submitted successfully.</p>
            <button class="modal-button" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        // Prevent right-click
        document.addEventListener("contextmenu", function(e) {
            e.preventDefault();
        });

        // Form submission handling
        document.getElementById('studentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if(confirm('Are you sure you want to submit?')) {
                const spinner = document.getElementById('loadingSpinner');
                spinner.style.display = 'block';

                try {
                    // Submit to Google Forms
                    const response = await fetch(this.action, {
                        method: 'POST',
                        body: new FormData(this),
                        mode: 'no-cors' // Prevents CORS issues
                    });

                    // Hide spinner and show success modal
                    spinner.style.display = 'none';
                    document.getElementById('successModal').style.display = 'block';
                    
                    // Reset form
                    this.reset();
                } catch (error) {
                    spinner.style.display = 'none';
                    alert('An error occurred. Please try again.');
                    console.error('Error:', error);
                }
            }
        });

        // Reset confirmation
        document.querySelector('button[type="reset"]').addEventListener('click', function(e) {
            if(!confirm('Are you sure you want to reset all fields?')) {
                e.preventDefault();
            }
        });

        // Close modal function
        function closeModal() {
            document.getElementById('successModal').style.display = 'none';
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('successModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

        // Number input validation
        document.querySelectorAll('input[type="number"]').forEach(input => {
            input.addEventListener('input', function() {
                if (this.value < 0) this.value = 0;
                if (this.value > 999) this.value = 999;
            });
        });
    </script>
</body>
</html>
